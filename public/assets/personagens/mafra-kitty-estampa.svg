<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Mafra Kitty - a estampa de gatinho da camisa">
  <defs><clipPath id="mk-print-clip"><circle cx="160" cy="160" r="150"/></clipPath></defs>
  <g clip-path="url(#mk-print-clip)">
    <circle cx="160" cy="160" r="150" fill="#7A4A2B"/>
    <ellipse cx="160" cy="150" rx="132" ry="128" fill="#8C5733"/>

    <!-- pedaco do tecido, com a costura da barra e uma dobra -->
    <rect x="10" y="10" width="300" height="300" fill="#EBE4D5"/>
    <path fill="#D3CAB6" stroke="none" opacity="0.75" d="M 10 10 L 62 10 C 46 96, 44 216, 58 310 L 10 310 Z"/>
    <path fill="#F5F1E6" stroke="none" opacity="0.8" d="M 258 10 L 310 10 L 310 310 L 266 310 C 278 214, 276 98, 258 10 Z"/>
    <g fill="none" stroke="#D3CAB6" stroke-width="2.6" stroke-dasharray="7 5">
      <path d="M 74 10 C 66 110, 66 214, 76 310"/>
      <path d="M 246 10 C 254 110, 254 214, 244 310"/>
    </g>

    <g transform="translate(160 150) scale(2.05)" stroke="#2A1B12"
       stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round">
    <!-- orelhas -->
    <path fill="#F7F3E9" d="M -44 -18 L -40 -60 C -39 -65, -34 -66, -30 -62 L -8 -40 Z"/>
    <path fill="#F7F3E9" d="M 44 -18 L 40 -60 C 39 -65, 34 -66, 30 -62 L 8 -40 Z"/>
    <path fill="#E9A79A" stroke="none" d="M -37 -26 L -34 -53 C -33.5 -56, -31 -56.5, -29 -54 L -14 -38 Z"/>
    <path fill="#E9A79A" stroke="none" d="M 37 -26 L 34 -53 C 33.5 -56, 31 -56.5, 29 -54 L 14 -38 Z"/>
    <!-- cabeca REDONDA (a da Sanrio e oval e deitada) -->
    <path fill="#F7F3E9" d="M -48 -4
      C -48 -34, -27 -48, 0 -48
      C 27 -48, 48 -34, 48 -4
      C 48 26, 27 42, 0 42
      C -27 42, -48 26, -48 -4 Z"/>
    <g fill="none" stroke="#2A1B12" stroke-width="2.11" stroke-linecap="round"><path d="M -46 2 L -70 -4"/><path d="M -46 10 L -72 10"/><path d="M -45 18 L -69 25"/><path d="M 46 2 L 70 -4"/><path d="M 46 10 L 72 10"/><path d="M 45 18 L 69 25"/></g>
    <!-- olhos -->
    <ellipse cx="-19" cy="-6" rx="6.4" ry="8.2" fill="#2A1B12" stroke="none"/>
    <ellipse cx="19"  cy="-6" rx="6.4" ry="8.2" fill="#2A1B12" stroke="none"/>
    <circle cx="-21" cy="-9.5" r="2.1" fill="#F7F3E9" stroke="none"/>
    <circle cx="17"  cy="-9.5" r="2.1" fill="#F7F3E9" stroke="none"/>
    <!-- bochechas coradas -->
    <ellipse cx="-33" cy="10" rx="8" ry="5.4" fill="#E9A79A" stroke="none" opacity="0.85"/>
    <ellipse cx="33"  cy="10" rx="8" ry="5.4" fill="#E9A79A" stroke="none" opacity="0.85"/>
    <!-- focinho de CORACAO -->
    <path fill="#E4572E" stroke="#2A1B12" stroke-width="1.81"
      d="M 0 16 C -4 10, -10 9, -10 4 C -10 0.5, -7 -1, -4.4 0.4 C -2.4 1.5, -1 3, 0 4.6
         C 1 3, 2.4 1.5, 4.4 0.4 C 7 -1, 10 0.5, 10 4 C 10 9, 4 10, 0 16 Z"/>
    <!-- BOCA: a Hello Kitty nao tem. Esta tem. -->
    <path fill="none" stroke="#2A1B12" stroke-width="2.28"
      d="M 0 16 L 0 21 M 0 21 C -3 27, -11 26, -13 20 M 0 21 C 3 27, 11 26, 13 20"/>
    <!-- coleira + guizo (no lugar do laco) -->
    <path fill="#F2C14E" d="M -35 30 C -22 42, 22 42, 35 30 C 33 38, 26 45, 18 48
      C 8 51, -8 51, -18 48 C -26 45, -33 38, -35 30 Z"/>
    <circle cx="0" cy="52" r="9" fill="#D9A83E"/>
    <path fill="none" stroke="#2A1B12" stroke-width="2.05" d="M -7.5 50 L 7.5 50 M 0 52 L 0 60"/>
  </g>
    <g transform="translate(64 268) scale(1.15)" stroke="#2A1B12" stroke-width="2.26" stroke-linejoin="round"><path fill="#F7F3E9" d="M 0 -7 C 8 -7, 14 -1, 14 6 C 14 14, 8 19, 0 19 C -8 19, -14 14, -14 6 C -14 -1, -8 -7, 0 -7 Z"/><ellipse cx="-15" cy="-9" rx="4.2" ry="5.4" fill="#F7F3E9" transform="rotate(-24 -15 -9)"/><ellipse cx="-5.5" cy="-16" rx="4.4" ry="5.6" fill="#F7F3E9" transform="rotate(-8 -5.5 -16)"/><ellipse cx="5.5" cy="-16" rx="4.4" ry="5.6" fill="#F7F3E9" transform="rotate(8 5.5 -16)"/><ellipse cx="15" cy="-9" rx="4.2" ry="5.4" fill="#F7F3E9" transform="rotate(24 15 -9)"/></g>
    <g transform="translate(258 258) scale(1.15)" stroke="#2A1B12" stroke-width="2.26" stroke-linejoin="round"><path fill="#F7F3E9" d="M 0 -7 C 8 -7, 14 -1, 14 6 C 14 14, 8 19, 0 19 C -8 19, -14 14, -14 6 C -14 -1, -8 -7, 0 -7 Z"/><ellipse cx="-15" cy="-9" rx="4.2" ry="5.4" fill="#F7F3E9" transform="rotate(-24 -15 -9)"/><ellipse cx="-5.5" cy="-16" rx="4.4" ry="5.6" fill="#F7F3E9" transform="rotate(-8 -5.5 -16)"/><ellipse cx="5.5" cy="-16" rx="4.4" ry="5.6" fill="#F7F3E9" transform="rotate(8 5.5 -16)"/><ellipse cx="15" cy="-9" rx="4.2" ry="5.4" fill="#F7F3E9" transform="rotate(24 15 -9)"/></g>
  </g>
  <circle cx="160" cy="160" r="150" fill="none" stroke="#2A1B12" stroke-width="12"/>
  <circle cx="160" cy="160" r="150" fill="none" stroke="#F2C14E" stroke-width="6"/>
</svg>
