      <g fill="none">
        <path stroke="#2A1B12"  stroke-width="36" d="M 116 168 C 111 200, 110 224, 113 242"/>
        <path stroke="#F4CFAA" stroke-width="28" d="M 116 168 C 111 200, 110 224, 113 242"/>
        <path stroke="#2A1B12"  stroke-width="38" d="M 147 170 C 145 204, 145 238, 148 262"/>
