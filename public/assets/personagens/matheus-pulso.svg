<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Matheus - alianca, perolas e corrente na mao direita">
  <defs><clipPath id="mt-wrist-clip"><circle cx="160" cy="160" r="150"/></clipPath></defs>
  <g clip-path="url(#mt-wrist-clip)">
