        <circle cx="112.0" cy="66" r="9" fill="#EDE6D6" stroke="#2A1B12" stroke-width="3"/><circle cx="109.0" cy="63" r="2.6" fill="#F5F1E6" stroke="none"/><circle cx="121.5" cy="68" r="9" fill="#EDE6D6" stroke="#2A1B12" stroke-width="3"/><circle cx="118.5" cy="65" r="2.6" fill="#F5F1E6" stroke="none"/><circle cx="131.0" cy="69" r="9" fill="#EDE6D6" stroke="#2A1B12" stroke-width="3"/><circle cx="128.0" cy="65" r="2.6" fill="#F5F1E6" stroke="none"/><circle cx="140.5" cy="69.5" r="9" fill="#EDE6D6" stroke="#2A1B12" stroke-width="3"/><circle cx="137.5" cy="65" r="2.6" fill="#F5F1E6" stroke="none"/><circle cx="150.0" cy="69.5" r="9" fill="#EDE6D6" stroke="#2A1B12" stroke-width="3"/><circle cx="147.0" cy="65" r="2.6" fill="#F5F1E6" stroke="none"/><circle cx="159.5" cy="69.5" r="9" fill="#EDE6D6" stroke="#2A1B12" stroke-width="3"/><circle cx="156.5" cy="65" r="2.6" fill="#F5F1E6" stroke="none"/><circle cx="169.0" cy="69" r="9" fill="#EDE6D6" stroke="#2A1B12" stroke-width="3"/><circle cx="166.0" cy="65" r="2.6" fill="#F5F1E6" stroke="none"/><circle cx="178.5" cy="68" r="9" fill="#EDE6D6" stroke="#2A1B12" stroke-width="3"/><circle cx="175.5" cy="65" r="2.6" fill="#F5F1E6" stroke="none"/><circle cx="188.0" cy="66" r="9" fill="#EDE6D6" stroke="#2A1B12" stroke-width="3"/><circle cx="185.0" cy="63" r="2.6" fill="#F5F1E6" stroke="none"/>
