<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Mufasa - avatar">
  <defs>
    <clipPath id="mf-av-clip"><circle cx="128" cy="128" r="120"/></clipPath>
  </defs>

  <g clip-path="url(#mf-av-clip)">
    <circle cx="128" cy="128" r="120" fill="#7A4A2B"/>
    <ellipse cx="128" cy="122" rx="106" ry="102" fill="#8C5733"/>

    <g stroke="#2A1B12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- ombro: camiseta preta de caimento reto -->
      <path fill="#33323A" d="M 16 262 C 20 212, 60 188, 102 180 L 154 180 C 196 188, 236 212, 240 262 Z"/>
      <path fill="#282730" stroke="none" d="M 16 262 C 20 212, 46 194, 66 187 C 52 206, 44 234, 42 262 Z"/>
      <path fill="#43424C" stroke="none" opacity="0.8" d="M 190 187 C 210 194, 236 212, 240 262 L 216 262 C 214 232, 206 206, 190 187 Z"/>
      <path fill="none" stroke="#2A1B12" stroke-width="5" d="M 16 262 C 20 212, 60 188, 102 180 L 154 180 C 196 188, 236 212, 240 262"/>

      <!-- pescoco: sobra so uma tira dele. E a GOLA ALTA que come o resto — e
           ela o sinal de busto que separa este rosto do Junior, que mostra
           pescoco, cordao e cristal no mesmo lugar. -->
      <path fill="#F4CFAA" d="M 110 150 L 110 190 C 110 204, 146 204, 146 190 L 146 150 Z"/>
      <path fill="#E0B189" stroke="none" d="M 110 152 C 122 176, 134 176, 146 154 L 146 152 L 110 152 Z"/>

      <path fill="#26252D" d="M 108 184 C 113 178, 143 178, 148 184
        L 152 208 C 144 216, 112 216, 104 208 Z"/>
      <path fill="#4E4D59" stroke="none" opacity="0.45" d="M 138 180 C 144 181, 147 182, 148 184
        L 152 208 C 149 211, 145 213, 141 214 C 143 201, 141 189, 138 180 Z"/>
      <g fill="none" stroke="#222129" stroke-width="3.4" opacity="0.85">
        <path d="M 107 194 C 116 199, 140 199, 149 194"/>
        <path d="M 106 202 C 115 207, 141 207, 150 202"/>
      </g>
    </g>


  <g stroke="#2A1B12" stroke-width="5.00" stroke-linecap="round" stroke-linejoin="round">

    <!-- rosto: mandibula masculina, queixo cheio -->
    <path fill="#F4CFAA" d="M 85 100
      C 85 57, 104 43, 128 43
      C 152 43, 171 57, 171 100
      C 171 130, 162 152, 149 163
      C 142 169, 136 171, 128 171
      C 120 171, 114 169, 107 163
      C 94 152, 85 130, 85 100 Z"/>

    <!-- LATERAIS AFILADAS. Nao e o fade do Junior, que vai a pele: aqui o pelo
         continua, so curto. Duas passadas de opacidade baixa e as costeletas,
         que sao por onde a lateral encontra a barba. -->
    <g stroke="none" fill="#372A21">
      <path opacity="0.22" d="M 86 96 C 88 108, 90 118, 95 128
        C 90 122, 86 112, 85 100 Z"/>
      <path opacity="0.22" d="M 170 96 C 168 108, 166 118, 161 128
        C 166 122, 170 112, 171 100 Z"/>
      <path opacity="0.30" d="M 85 100 C 88 93, 92 89, 97 87
        C 94 96, 92 106, 91 116 C 88 112, 86 106, 85 100 Z"/>
      <path opacity="0.30" d="M 171 100 C 168 93, 164 89, 159 87
        C 162 96, 164 106, 165 116 C 168 112, 170 106, 171 100 Z"/>
      <path opacity="0.66" d="M 90 108 C 94 110, 97 116, 97 126 L 92 124 Z"/>
      <path opacity="0.66" d="M 166 108 C 162 110, 159 116, 159 126 L 164 124 Z"/>
    </g>

    <!-- BARBA CURTA, densa no queixo e RALA NA BOCHECHA. E o contrario da do
         Junior, que e cheia e com a linha da bochecha marcada. -->
    <path stroke="none" fill="#372A21" opacity="0.34" d="M 90 112
      C 94 134, 100 148, 108 157 C 116 162, 140 162, 148 157
      C 156 148, 162 134, 166 112 C 168 138, 160 158, 146 167
      C 140 170, 134 172, 128 172 C 122 172, 116 170, 110 167
      C 96 158, 88 138, 90 112 Z"/>
    <path stroke="none" fill="#372A21" opacity="0.92" d="M 93 122
      C 96 140, 101 153, 109 161
      C 116 152, 140 152, 147 161
      C 155 153, 160 140, 163 122
      C 167 142, 162 158, 150 167
      C 143 170, 136 172, 128 172
      C 120 172, 113 170, 106 167
      C 94 158, 89 142, 93 122 Z"/>
    <path stroke="none" fill="#281E18" opacity="0.50" d="M 110 160
      C 116 164, 140 164, 146 160 C 144 168, 137 172, 128 172
      C 119 172, 112 168, 110 160 Z"/>
    <!-- BIGODE: o traco dominante do rosto. Mais largo que o do Junior e com
         as pontas caindo abaixo do canto da boca. -->
    <path stroke="none" fill="#372A21" opacity="0.95" d="M 108 133
      C 115 128, 122 130, 128 134 C 134 130, 141 128, 148 133
      C 149 141, 143 146, 137 143 C 133 141, 123 141, 119 143
      C 113 146, 107 141, 108 133 Z"/>

    <!-- CABELO: cachos. Halo por fora, como toda massa escura do elenco. -->
    <path fill="none" stroke="#8C6A45" stroke-width="7.25" opacity="0.8" stroke-linejoin="round" d="M 82 114 C 78 106, 76 100, 75.0 94.0 Q 66.2 82.2 77.1 73.2 Q 64.8 56.5 83.4 54.0 Q 81.6 40.1 93.3 38.1 Q 89.4 16.4 106.0 26.7 Q 109.8 12.2 120.5 20.8 Q 128.0 4.8 135.5 20.8 Q 145.0 16.0 150.0 26.7 Q 166.1 17.2 162.7 38.1 Q 176.0 38.8 172.6 54.0 Q 189.4 57.3 178.9 73.2 Q 188.8 82.3 181.0 94.0 C 179 100, 176 106, 172 114 C 173 106, 170 98, 166 92 C 163 79, 157 87, 151 84 C 147 79, 142 86, 137 83 C 132 77, 126 88, 121 85 C 117 81, 113 86, 108 81 C 104 77, 98 87, 94 85 C 92 83, 91 88, 90 92 C 87 98, 84 106, 82 114 Z"/>
    <path fill="#372A21" d="M 82 114 C 78 106, 76 100, 75.0 94.0 Q 66.2 82.2 77.1 73.2 Q 64.8 56.5 83.4 54.0 Q 81.6 40.1 93.3 38.1 Q 89.4 16.4 106.0 26.7 Q 109.8 12.2 120.5 20.8 Q 128.0 4.8 135.5 20.8 Q 145.0 16.0 150.0 26.7 Q 166.1 17.2 162.7 38.1 Q 176.0 38.8 172.6 54.0 Q 189.4 57.3 178.9 73.2 Q 188.8 82.3 181.0 94.0 C 179 100, 176 106, 172 114 C 173 106, 170 98, 166 92 C 163 79, 157 87, 151 84 C 147 79, 142 86, 137 83 C 132 77, 126 88, 121 85 C 117 81, 113 86, 108 81 C 104 77, 98 87, 94 85 C 92 83, 91 88, 90 92 C 87 98, 84 106, 82 114 Z"/>
    <path fill="#281E18" stroke="none" d="M 82 114 C 79 102, 77 88, 78 74
      C 84 86, 88 100, 90 114 C 86 113, 84 113, 82 114 Z"/>
    <path fill="#281E18" stroke="none" d="M 172 114 C 175 102, 177 88, 176 74
      C 170 86, 166 100, 164 114 C 168 113, 170 113, 172 114 Z"/>
    <path transform="rotate(25 99 62)" fill="none" stroke="#6B4F38" stroke-width="2.50" stroke-linecap="round" opacity="0.45" d="M 90 62 A 9 9 0 1 1 108.0 62.9"/><path transform="rotate(-12 116 46)" fill="none" stroke="#6B4F38" stroke-width="2.50" stroke-linecap="round" opacity="0.45" d="M 108 46 A 8 8 0 1 1 124.0 46.8"/><path transform="rotate(18 136 42)" fill="none" stroke="#6B4F38" stroke-width="2.50" stroke-linecap="round" opacity="0.45" d="M 127 42 A 9 9 0 1 1 145.0 42.9"/><path transform="rotate(32 156 58)" fill="none" stroke="#6B4F38" stroke-width="2.50" stroke-linecap="round" opacity="0.45" d="M 148 58 A 8 8 0 1 1 164.0 58.8"/><path transform="rotate(-18 108 80)" fill="none" stroke="#6B4F38" stroke-width="2.50" stroke-linecap="round" opacity="0.45" d="M 101 80 A 7 7 0 1 1 115.0 80.7"/><path transform="rotate(-34 146 76)" fill="none" stroke="#6B4F38" stroke-width="2.50" stroke-linecap="round" opacity="0.45" d="M 139 76 A 7 7 0 1 1 153.0 76.7"/>

    <!-- ORELHAS depois do cabelo: sao curtas dos lados, a orelha fica na
         frente. Uma argola em cada uma. -->
    <ellipse cx="81"  cy="115" rx="7.5" ry="11" fill="#F4CFAA"/>
    <ellipse cx="175" cy="115" rx="7.5" ry="11" fill="#F4CFAA"/>
    <path fill="none" stroke="#2A1B12" stroke-width="2.75" d="M 80 111 C 83 113, 83 118, 80 121"/>
    <path fill="none" stroke="#2A1B12" stroke-width="2.75" d="M 176 111 C 173 113, 173 118, 176 121"/>
    <circle cx="81" cy="132" r="3.4" fill="none" stroke="#2A1B12" stroke-width="4.00"/><circle cx="81" cy="132" r="3.4" fill="none" stroke="#C9CDD2" stroke-width="2.10"/>
    <circle cx="175" cy="132" r="3.4" fill="none" stroke="#2A1B12" stroke-width="4.00"/><circle cx="175" cy="132" r="3.4" fill="none" stroke="#C9CDD2" stroke-width="2.10"/>

    <!-- sobrancelhas: grossas e retas -->
    <path fill="none" stroke="#281E18" stroke-width="9.00" d="M 92 96 C 102 89, 116 89, 124 94"/>
    <path fill="none" stroke="#281E18" stroke-width="9.00" d="M 132 94 C 140 89, 154 89, 164 96"/>

    <!-- ARGOLA NA SOBRANCELHA DIREITA (= direita dele, esquerda de quem olha,
         a mesma convencao do sinal da Gabizinsky). Fica na ponta de fora da
         sobrancelha: e o unico vao livre entre a franja em cima e o aro dos
         oculos embaixo — 6 unidades de folga para cada lado. -->
    <circle cx="98" cy="94" r="4.6" fill="none" stroke="#2A1B12" stroke-width="4.00"/><circle cx="98" cy="94" r="4.6" fill="none" stroke="#C9CDD2" stroke-width="2.10"/><circle cx="98" cy="89.4" r="1.70" fill="#C9CDD2" stroke="#2A1B12" stroke-width="1.10"/>

    <!-- olhos -->
    <g>
      <ellipse cx="107" cy="117" rx="11" ry="11" fill="#F5F1E6"/>
      <circle cx="108" cy="118" r="7.6" fill="#4A3526" stroke="none"/>
      <circle cx="108" cy="118" r="3.4" fill="#2A1B12" stroke="none"/>
      <circle cx="105" cy="114.5" r="2.5" fill="#F5F1E6" stroke="none"/>
      <path fill="none" stroke="#2A1B12" stroke-width="6.50" d="M 97 112 C 102 105, 113 105, 118 112"/>
    </g>
    <g>
      <ellipse cx="151" cy="117" rx="11" ry="11" fill="#F5F1E6"/>
      <circle cx="150" cy="118" r="7.6" fill="#4A3526" stroke="none"/>
      <circle cx="150" cy="118" r="3.4" fill="#2A1B12" stroke="none"/>
      <circle cx="147" cy="114.5" r="2.5" fill="#F5F1E6" stroke="none"/>
      <path fill="none" stroke="#2A1B12" stroke-width="6.50" d="M 140 112 C 145 105, 156 105, 161 112"/>
    </g>

    <!-- nariz -->
    <path fill="none" stroke="#2A1B12" stroke-width="5.00" d="M 123 120 C 125 130, 132 133, 137 128"/>

    <!-- boca: o sorriso e dele. Nas tres fotos de referencia ele aparece serio
         numa e rindo largo nas outras duas; o elenco inteiro e serio ou quase,
         entao ele fica com a curva mais aberta da mesa sem virar careta. -->
    <path fill="none" stroke="#2A1B12" stroke-width="6.00" d="M 117 147 C 123 153, 134 153, 140 146"/>

    
    <defs>
      <clipPath id="mf-av-ll"><path d="M 87 118 C 87 108, 95 103, 106 103 C 117 103, 125 108, 125 118 C 125 128, 117 133, 106 133 C 95 133, 87 128, 87 118 Z"/></clipPath>
      <clipPath id="mf-av-lr"><path d="M 171 118 C 171 108, 163 103, 152 103 C 141 103, 133 108, 133 118 C 133 128, 141 133, 152 133 C 163 133, 171 128, 171 118 Z"/></clipPath>
    </defs>
    <path d="M 87 118 C 87 108, 95 103, 106 103 C 117 103, 125 108, 125 118 C 125 128, 117 133, 106 133 C 95 133, 87 128, 87 118 Z" fill="#F5F1E6" opacity="0.09" stroke="none"/>
    <path d="M 171 118 C 171 108, 163 103, 152 103 C 141 103, 133 108, 133 118 C 133 128, 141 133, 152 133 C 163 133, 171 128, 171 118 Z" fill="#F5F1E6" opacity="0.09" stroke="none"/>
    <g clip-path="url(#mf-av-ll)" stroke="#F5F1E6" fill="none" opacity="0.36" stroke-linecap="round">
      <path stroke-width="4.65" d="M 92 124 L 103 110"/>
    </g>
    <g clip-path="url(#mf-av-lr)" stroke="#F5F1E6" fill="none" opacity="0.36" stroke-linecap="round">
      <path stroke-width="4.65" d="M 138 124 L 149 110"/>
    </g>
    <g fill="none" stroke="#A8AEB5" stroke-width="3.10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 87 118 C 87 108, 95 103, 106 103 C 117 103, 125 108, 125 118 C 125 128, 117 133, 106 133 C 95 133, 87 128, 87 118 Z"/>
      <path d="M 171 118 C 171 108, 163 103, 152 103 C 141 103, 133 108, 133 118 C 133 128, 141 133, 152 133 C 163 133, 171 128, 171 118 Z"/>
      <path d="M 125 114 L 133 114"/>
      <path d="M 87 114 C 83 113, 80 112, 77 113"/>
      <path d="M 171 114 C 175 113, 178 112, 181 113"/>
    </g>
    <g fill="none" stroke="#C9CDD2" stroke-width="1.40" stroke-linecap="round">
      <path d="M 93 108 C 99 104, 113 104, 119 108"/>
      <path d="M 165 108 C 159 104, 145 104, 139 108"/>
    </g>

  </g>
  </g>

  <circle cx="128" cy="128" r="120" fill="none" stroke="#2A1B12" stroke-width="10"/>
  <circle cx="128" cy="128" r="120" fill="none" stroke="#F2C14E" stroke-width="5"/>
</svg>
