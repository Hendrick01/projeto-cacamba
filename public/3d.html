<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1b12">
<title>Caçamba em 3D</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fontes.css">
<style>
  /* A tela 3D não usa o style.css do jogo: aqui quase tudo é desenhado no
     canvas, e o pouco que é HTML fica por cima dele. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #1b110b; overflow: hidden; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: #f5f1e6;
    -webkit-tap-highlight-color: transparent;
  }
  /* canvas é elemento substituído: `inset: 0` sozinho NÃO o estica como a uma
     div — ele fica no tamanho intrínseco do buffer (2x da tela, pelo
     pixelRatio) e vaza, mostrando só um canto da cena. O width/height explícito
     é o que o prende à janela. */
  #cena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .painel {
    position: fixed; left: 0; right: 0; top: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: max(10px, env(safe-area-inset-top)) 14px 10px;
    background: linear-gradient(180deg, rgba(27, 17, 11, 0.9) 0%, rgba(27, 17, 11, 0) 100%);
    pointer-events: none;
  }
  .painel .rodada { line-height: 1.2; }
  .painel small {
    display: block; color: #8c6a45; font-size: 0.7rem;
    font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .painel strong { color: #f2c14e; font-size: 1rem; font-weight: 900; }
  .voltar {
    pointer-events: auto;
    border: 1px solid rgba(140, 106, 69, 0.5);
    background: rgba(0, 0, 0, 0.4); color: #f5f1e6;
    font: inherit; font-weight: 900; font-size: 0.82rem;
    padding: 8px 14px; border-radius: 20px; cursor: pointer;
  }
  .painel .botoes { display: flex; gap: 8px; pointer-events: auto; }
  .voltar.voz-on { color: #58c98a; border-color: rgba(88, 201, 138, 0.7); box-shadow: 0 0 8px rgba(88, 201, 138, 0.45); }
  .voltar.voz-mudo { color: #e4572e; border-color: rgba(228, 87, 46, 0.6); }
  .aviso {
    /* No alto, logo abaixo do painel: embaixo ele caía em cima do leque. */
    position: fixed; left: 50%; top: max(74px, calc(env(safe-area-inset-top) + 62px));
    transform: translateX(-50%);
    background: rgba(27, 17, 11, 0.92);
    border: 1px solid rgba(140, 106, 69, 0.5);
    padding: 10px 16px; border-radius: 14px;
    font-size: 0.86rem; font-weight: 700; text-align: center;
    max-width: 90vw;
  }
  /* Em tela larga o elenco do fundo fica logo abaixo do painel, e o aviso
     caía na cara de quem senta à frente. Sobe para a faixa do painel, entre
     o rótulo da rodada e os botões, onde não há rosto. */
  @media (min-aspect-ratio: 1/1) {
    .aviso { top: max(10px, env(safe-area-inset-top)); left: 46%; max-width: 34vw; padding: 7px 12px; font-size: 0.8rem; }
  }
  /* O visor de jogos: a mesa cheia lida carta por carta. Abre no toque num
     jogo do feltro (ou no botão da barra) e é por ele que se encaixa. */
  /* `display:flex` na classe ganha do `[hidden]` do navegador: sem esta linha
     o visor fica aberto para sempre. */
  .visor-jogos[hidden] { display: none; }
  .visor-jogos {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(10, 6, 4, 0.62);
    padding: 12px;
  }
  .visor-caixa {
    width: min(680px, 100%); max-height: 82vh;
    display: flex; flex-direction: column;
    background: #10221b; border: 1px solid rgba(197, 180, 108, 0.45);
    border-radius: 18px 18px 12px 12px; overflow: hidden;
    box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.6);
  }
  .visor-caixa header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid rgba(197, 180, 108, 0.25);
    background: #0b1b16;
  }
  .visor-caixa header strong { font-size: 0.95rem; color: #f5d28b; }
  .visor-x {
    border: 1px solid rgba(210, 197, 151, 0.4); background: rgba(0, 0, 0, 0.3);
    color: #f5f1e6; font: inherit; font-weight: 800; font-size: 0.78rem;
    padding: 7px 14px; border-radius: 10px; cursor: pointer;
  }
  .visor-corpo { overflow-y: auto; padding: 10px 12px 16px; -webkit-overflow-scrolling: touch; }
  .visor-vazio { color: #cad6be; padding: 18px 4px; text-align: center; }
  .visor-jogador {
    border-left: 4px solid var(--cor, #f2c14e);
    padding: 6px 0 10px 10px; margin-bottom: 10px;
  }
  .visor-jogador.foco { background: rgba(255, 255, 255, 0.04); border-radius: 0 10px 10px 0; }
  .visor-jogador h3 {
    font-size: 0.78rem; font-weight: 900; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--cor, #f2c14e); margin-bottom: 6px;
  }
  .visor-jogo {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px;
    padding: 6px 0;
  }
  .visor-cartas { display: flex; gap: 4px; }
  .visor-slot { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .visor-carta {
    width: 54px; height: 76px; border-radius: 5px; display: block;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
  }
  .visor-encaixes { display: flex; flex-direction: column; gap: 4px; }
  .visor-acao {
    border: 1px solid rgba(210, 197, 151, 0.45); background: rgba(0, 0, 0, 0.35);
    color: #f5f1e6; font: inherit; font-weight: 800; font-size: 0.68rem;
    padding: 5px 9px; border-radius: 9px; cursor: pointer; white-space: nowrap;
  }
  .visor-acao.forte { background: #f2c14e; color: #23150c; border-color: #f2c14e; }
  /* O PLACAR (fim de rodada e de jogo), na mesma caixa do visor, mas no meio
     da tela: é a vez de ler, não de jogar. */
  .placar-3d { align-items: center; }
  .placar-3d .visor-caixa { width: min(440px, 100%); border-radius: 18px; }
  .placar-3d .palco { text-align: center; padding: 4px 0 0; }
  .placar-3d .palco img { height: 128px; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.5)); }
  .placar-3d h2 { font-size: 1.15rem; color: #f5d28b; text-align: center; margin: 6px 0 2px; }
  .placar-3d .sub { color: #cad6be; text-align: center; font-size: 0.82rem; margin-bottom: 8px; }
  .placar-3d table { width: 100%; border-collapse: collapse; }
  .placar-3d th { font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: #8c6a45; text-align: left; padding: 4px 6px; }
  .placar-3d td { padding: 7px 6px; border-top: 1px solid rgba(197, 180, 108, 0.18); font-size: 0.9rem; }
  .placar-3d .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 900; }
  .placar-3d .quem { display: flex; align-items: center; gap: 8px; }
  .placar-3d .quem img { width: 28px; height: 28px; border-radius: 50%; background: #1b110b; box-shadow: 0 0 0 2px var(--anel, #8c6a45); }
  .placar-3d tr.vencedor td { color: #f5d28b; }
  .placar-3d .espera { color: #cad6be; text-align: center; font-size: 0.84rem; padding: 10px 0 2px; }
  .placar-acoes { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 10px 12px 12px; border-top: 1px solid rgba(197, 180, 108, 0.25); background: #0b1b16; }
  .placar-acoes:empty { display: none; }
  .placar-acoes .visor-acao { font-size: 0.84rem; padding: 9px 14px; }
</style>
<link rel="stylesheet" href="interface.css">
<link rel="stylesheet" href="emotes.css">
</head>
<body class="ui-3d">

<canvas id="cena" aria-label="Mesa de cartas em 3D"></canvas>
<div class="ui-3d-footer"><span data-interface-version>UI 07.09 / R1</span> · <span data-connection role="status">Conectando…</span></div>

<div class="painel">
  <div class="rodada"><small id="rot-rodada">carregando</small><strong id="rot-contrato">—</strong></div>
  <span class="botoes"><button class="voltar" id="btn-voz">🎙 voz</button><button class="voltar" id="btn-emote" title="Emotes e frases prontas" aria-label="Emotes e frases prontas">💬</button><button class="voltar" id="btn-voltar">← mesa normal</button></span>
</div>

<p class="aviso" id="aviso">Abrindo a mesa em 3D…</p>

<script type="module" src="mesa3d-visual.js"></script>
</body>
</html>
